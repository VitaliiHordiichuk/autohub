name: Telegram catalogue checks

on:
  push:
    branches:
      - feat/telegram-catalog-search-2026-10-24
  pull_request:
    paths:
      - "src/services/Telegram*"
      - ".env.example"
      - ".github/workflows/telegram-catalog-checks.yml"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Telegram catalogue + existing notifications regression
        run: node --test src/services/TelegramCatalogFormatter.test.js src/services/TelegramCatalogService.test.js src/services/TelegramNotificationService.test.js
      - name: JavaScript syntax
        run: |
          node --check src/services/TelegramBotService.js
          node --check src/services/TelegramCatalogFormatter.js
          node --check src/services/TelegramCatalogService.js
